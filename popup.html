<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      margin: 0;
      background-color: #f9f9f9;
      color: #333;
    }
    h3 {
      font-size: 14px;
      margin-top: 0;
      color: #1a73e8;
    }
    #selected-text {
      background: #fff;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 10px;
      max-height: 60px;
      overflow-y: auto;
    }
    #result {
      background: #fff;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      min-height: 80px;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 10px;
    }
    button:hover {
      background-color: #1557b0;
    }
  </style>
</head>
<body>
  <h3>选中内容：</h3>
  <div id="selected-text">请先在网页上划取文字...</div>
  <button id="explain-btn">用简单词汇解释</button>
  <h3>AI 解释：</h3>
  <div id="result">等待操作...</div>

  <script src="popup.js"></script>
</body>
</html>
